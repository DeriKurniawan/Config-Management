# GO Feature Flag configuration file
# This file defines feature flags for enabling/disabling features without code changes
# Documentation: https://gofeatureflag.org/docs
# Targeting rules format: https://gofeatureflag.org/docs/configure_flag/target-with-flags#nikunjyrules-format
#
# Each flag contains:
# - variations: possible values the flag can return
# - defaultRule: default variation when no targeting rules match
# - targeting: rules for specific audiences or conditions

allow_to_adjust_stt_piece_add:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
  targeting:
    - query: 'bookingClientCode IN ["CL15207","CL13334"] and prefix IN ["99", "98", "95", "19", "C1", "C2"]'
      variation: enabled

allow_to_adjust_stt_piece_remove:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
  targeting:
    - query: 'bookingClientCode IN ["CL15207","CL13334"] and prefix IN ["99", "98", "95", "19", "C1", "C2"]'
      variation: enabled

free_booking_return_date:
  variations:
    date: "2025-08-27"
  defaultRule:
    variation: date
    
free_booking_return:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled

allow_dispatch_validation_3lc:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
  targeting:
  - name: partner_3lc_with_hub
    query: partner_3lc in ["CGK"]
    variation: enabled

whitelist_dispatch_validation_status_inhub:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
  targeting:
    - query: 'last_status IN ["STI-DEST","IN-HUB","OUT-HUB"] and target_status IN ["KONDISPATCH"]'
      variation: enabled          

allow_hub_validation_3lc:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
  targeting:
  - query: partner_3lc in ["CGK"]
    variation: enabled
    
whitelist_hub_validation_status:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
  targeting:
    - name: rules_1
      query: last_status in ["STI","BAGGING","OUT-HUB","IN-HUB"] and target_status in
        ["BAGGING","CARGO PLANE","CARGO TRUCK","CARGO TRAIN","CARGO SHIP"]
      variation: enabled

3lc_required_kondispatch:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: disabled
  targeting:
    - name: rules_1
      query: partner_3lc in ["CGK"] and last_status in ["STI-DEST","IN-HUB","OUT-HUB"] and target_status in ["STLDISPATCH"]
      variation: enabled
    - name: rules_2
      query: partner_3lc in ["CGK"] and last_status in ["STI-DEST","IN-HUB","OUT-HUB"] and target_status in ["DEL"]
      variation: enabled

deprecated_product_types:
  variations:
    enabled: true
    disabled: false
  defaultRule:
    variation: enabled
  targeting:
    - query: 'productType IN ["JUMBOPACK","JUMBOPACKH2H","OTOPACK150","OTOPACK250"]'
      variation: enabled

disable_booking_product_types_date:
  variations:
    date: "2025-10-01"
  defaultRule:
    variation: date

disable_tariff_product_types_date:
  variations:
    date: "2025-09-22"
  defaultRule:
    variation: date
